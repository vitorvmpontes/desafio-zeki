name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        # `python -m pip`/`python -m pytest`, NUNCA `pip`/`pytest` sem
        # prefixo: o runner tem mais de um `pytest` no PATH (mesmo bug
        # encontrado no ambiente de desenvolvimento, ver docs/DEVLOG.md) --
        # sem o `python -m`, o comando pode resolver para um executavel de
        # OUTRO lugar, sem os pacotes que acabamos de instalar aqui, dando
        # `ModuleNotFoundError` mesmo com a instalacao tendo funcionado.
        run: python -m pip install -r etl/requirements.txt -r ml/requirements.txt -r api/requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest)
        run: python -m pytest -v