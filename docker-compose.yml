services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      # sobrescreve o DATABASE_URL do .env (que aponta para "localhost",
      # certo para rodar etl.load_db do HOST): dentro da rede do compose o
      # Postgres e alcancado pelo nome do servico, "db", nao "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # idem para o chat (POST /chat, opcional -- ver api/README.md e
      # db/readonly_role.sql): mesmo problema de "localhost" vs "db", agora
      # pro role SOMENTE LEITURA em vez do usuario de escrita. Sem efeito
      # pratico enquanto GEMINI_API_KEY nao estiver definida (chat continua
      # desabilitado, 503) -- so importa depois que voce rodar
      # db/readonly_role.sql e configurar as duas variaveis no .env. Se voce
      # mudou usuario/senha do role no script, ajuste aqui tambem.
      DATABASE_URL_READONLY: postgresql://continua_readonly:continua_readonly@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # a tabela municipio_mes precisa ja existir no banco antes da API subir
    # (via `make load-db` / `python -m etl.load_db`, rodado do HOST contra
    # localhost:5432 -- ver README.md "como rodar do zero") -- a API so LE
    # do Postgres, nao carrega dado nenhum.

  web:
    build:
      context: ./web
      args:
        # Vite injeta isso em tempo de BUILD (nao de execucao) -- precisa
        # ser o endereco que o NAVEGADOR do usuario alcanca, nao um nome
        # interno da rede do compose (por isso "localhost:8000", nao "api:8000").
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db_data:
