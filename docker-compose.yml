# Serviços de api e web serão adicionados aqui conforme forem implementados
# (dias 5 e 6 do plano em docs/DEVLOG.md) — mantendo este arquivo sempre
# funcional em vez de referenciar Dockerfiles que ainda não existem.

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
