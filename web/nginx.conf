server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que nao seja um arquivo estatico cai no
    # index.html, para o react-router (BrowserRouter) tratar client-side --
    # sem isso, recarregar a pagina em /municipios/1100015 daria 404 no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
